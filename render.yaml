services:
  - type: web
    name: rpd-money-engine
    runtime: docker
    plan: free
    region: singapore
    branch: rpd-money-engine-v1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      - key: RPD_ADMIN_TOKEN
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: rpd-browser-worker
    runtime: docker
    plan: free
    region: singapore
    branch: rpd-money-engine-v1
    dockerfilePath: ./browser-worker/Dockerfile
    dockerContext: ./browser-worker
    autoDeployTrigger: commit
